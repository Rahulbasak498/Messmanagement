<!doctype html><html lang="bn"><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>মেস হিসাব - মাসিক ব্যবস্থাপনা</title>
<meta name="theme-color" content="#3A3FCB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Baloo+Da+2:wght@600;700;800&display=swap">


<link rel="stylesheet" href="styles.css">
</head><body>

<div class="wrap" id="appShell">
  <header class="top">
    <div class="brand">
      <h1>মেস হিসাব</h1>
      <input id="messName" class="name-in" aria-label="মেসের নাম" placeholder="মেসের নাম লিখুন" maxlength="40">
    </div>
    <div class="month">
      <button class="iconbtn" data-act="prev" aria-label="আগের মাস">&#8249;</button>
      <span id="monthLabel">...</span>
      <button class="iconbtn" data-act="next" aria-label="পরের মাস">&#8250;</button>
    </div>
    <button class="btn" data-act="theme" aria-label="থিম বদলান" title="লাইট/ডার্ক মোড">◐ <span class="theme-label">থিম</span></button>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="বিভাগ">
    <button class="tab" role="tab" data-act="tab" data-tab="hishab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg><span>হিসাব</span></button>
    <button class="tab" role="tab" data-act="tab" data-tab="meal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18a9 9 0 0 1-18 0z"/><path d="M8.5 8c0-1.6 1.2-1.6 1.2-3.2M14 8c0-1.6 1.2-1.6 1.2-3.2"/></svg><span>মিল</span></button>
    <button class="tab" role="tab" data-act="tab" data-tab="bazar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg><span>বাজার</span></button>
    <button class="tab" role="tab" data-act="tab" data-tab="kharoch"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg><span>নির্ধারিত খরচ</span></button>
    <button class="tab" role="tab" data-act="tab" data-tab="member"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 5a3.2 3.2 0 0 1 0 6M18 14.5c2 .7 3.5 2.5 3.5 5.5"/></svg><span>সদস্য</span></button>
  </nav>

  <main id="view"><p class="hint">লোড হচ্ছে...</p></main>
  <div class="status" id="status" aria-live="polite"></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script src="app.js"></script>
</body></html>
